[project]
name = "python-for-business-analytics"
version = "0.1.0"
description = "Программирование на Python для бизнес-аналитики — материалы курса (ВШБ НИУ ВШЭ, БАЦРФ)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=3.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pyright>=1.1.411",
]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
