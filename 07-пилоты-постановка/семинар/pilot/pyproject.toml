# Окружение для тем 07–08 и ДЗ-3: HypEx 1.0.7.
#
# Отдельное от основного prime-monitor, потому что HypEx 1.0.7 работает
# только с pandas ≤ 2.2.3 и numpy ≤ 1.26.4, а в prime-monitor — pandas 3.
# Положите папку pilot/ в корень prime-monitor и запускайте оттуда:
#
#     uv run --project pilot jupyter lab
#
# Пакет prime отсюда не устанавливается: ноутбуки подключают src/ сами.

[project]
name = "prime-pilot"
version = "0.1.0"
description = "Окружение пилота: HypEx 1.0.7 для тем 07–08 и ДЗ-3"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hypex==1.0.7",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "scipy>=1.13,<=1.13.1",
    "statsmodels<=0.14.2",
    "matplotlib<=3.9.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "jupyterlab>=4.4",
    "ipykernel>=7.0",
]

[tool.uv]
package = false
